[project]
name = "artcraft-auto-tag"
version = "0.1.0"
description = "Privacy-conscious Discord forum auto-tagging with OpenRouter"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.7.1,<2.8",
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
artcraft-bot = "artcraft.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artcraft"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
